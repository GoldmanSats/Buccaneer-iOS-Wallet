openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Buccaneer Wallet API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: wallet
    description: Lightning wallet operations
  - name: settings
    description: User settings
  - name: owner-auth
    description: Owner device authentication and sessions
  - name: agent-keys
    description: NWC agent key management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /wallet/balance:
    get:
      operationId: getBalance
      tags: [wallet]
      summary: Get wallet balance
      responses:
        "200":
          description: Wallet balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletBalance"
        "500":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /wallet/transactions:
    get:
      operationId: getTransactions
      tags: [wallet]
      summary: Get transaction history
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Transaction list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionList"
        "500":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /wallet/send:
    post:
      operationId: sendPayment
      tags: [wallet]
      summary: Send Lightning payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendPaymentRequest"
      responses:
        "200":
          description: Payment sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendPaymentResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /wallet/decode-invoice:
    post:
      operationId: decodeInvoice
      tags: [wallet]
      summary: Decode a Lightning invoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecodeInvoiceRequest"
      responses:
        "200":
          description: Decoded invoice details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecodedInvoice"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /wallet/receive:
    post:
      operationId: createInvoice
      tags: [wallet]
      summary: Create Lightning invoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvoiceRequest"
      responses:
        "200":
          description: Invoice created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateInvoiceResponse"
        "500":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /wallet/lightning-address:
    get:
      operationId: getLightningAddress
      tags: [wallet]
      summary: Get static Lightning address
      responses:
        "200":
          description: Lightning address info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LightningAddressInfo"

  /wallet/btc-price:
    get:
      operationId: getBtcPrice
      tags: [wallet]
      summary: Get current BTC price in fiat
      parameters:
        - name: currency
          in: query
          schema:
            type: string
            default: USD
      responses:
        "200":
          description: BTC price
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BtcPrice"

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get user settings
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSettings"
    put:
      operationId: updateSettings
      tags: [settings]
      summary: Update user settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettingsRequest"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSettings"

  /agent-keys:
    get:
      operationId: getAgentKeys
      tags: [agent-keys]
      summary: Get all agent keys
      security:
        - ownerSessionHeader: []
      responses:
        "200":
          description: List of agent keys
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentKeyList"
    post:
      operationId: createAgentKey
      tags: [agent-keys]
      summary: Create a new agent key
      security:
        - ownerSessionHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgentKeyRequest"
      responses:
        "201":
          description: Agent key created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentKey"

  /agent-keys/{id}:
    patch:
      operationId: updateAgentKey
      tags: [agent-keys]
      summary: Update an agent key
      security:
        - ownerSessionHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAgentKeyRequest"
      responses:
        "200":
          description: Agent key updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentKey"
    delete:
      operationId: deleteAgentKey
      tags: [agent-keys]
      summary: Delete an agent key
      security:
        - ownerSessionHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"

  /agent-keys/{id}/logs:
    get:
      operationId: getAgentKeyLogs
      tags: [agent-keys]
      summary: Get recent agent key activity
      security:
        - ownerSessionHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Agent key activity log
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentLogList"

  /owner-auth/bootstrap/device:
    post:
      operationId: bootstrapOwnerDevice
      tags: [owner-auth]
      summary: Register or relabel an owner device
      security:
        - ownerBootstrapHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BootstrapOwnerDeviceRequest"
      responses:
        "200":
          description: Owner device updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerDevice"
        "201":
          description: Owner device created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerDevice"

  /owner-auth/register-initial-device:
    post:
      operationId: registerInitialOwnerDevice
      tags: [owner-auth]
      summary: Register the first trusted owner device when none exists yet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BootstrapOwnerDeviceRequest"
      responses:
        "201":
          description: First owner device created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerDevice"

  /owner-auth/challenge:
    post:
      operationId: createOwnerAuthChallenge
      tags: [owner-auth]
      summary: Create an owner auth challenge for a registered device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnerAuthChallengeRequest"
      responses:
        "200":
          description: Challenge created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerAuthChallengeResponse"

  /owner-auth/verify:
    post:
      operationId: verifyOwnerAuthChallenge
      tags: [owner-auth]
      summary: Verify a signed owner auth challenge and issue a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnerAuthVerifyRequest"
      responses:
        "200":
          description: Owner session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerSessionResponse"

  /owner-auth/logout:
    post:
      operationId: logoutOwnerSession
      tags: [owner-auth]
      summary: Revoke the current owner session
      security:
        - ownerSessionHeader: []
      responses:
        "200":
          description: Owner session revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"

  /owner-auth/status:
    get:
      operationId: getOwnerSessionStatus
      tags: [owner-auth]
      summary: Get the current owner session status
      security:
        - ownerSessionHeader: []
      responses:
        "200":
          description: Active owner session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerSessionStatus"

  /wallet/seed-phrase:
    get:
      operationId: getSeedPhrase
      tags: [wallet]
      summary: Get wallet seed phrase (protected)
      responses:
        "200":
          description: Seed phrase words
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeedPhraseResponse"

components:
  securitySchemes:
    ownerSessionHeader:
      type: apiKey
      in: header
      name: X-Owner-Session
    ownerBootstrapHeader:
      type: apiKey
      in: header
      name: X-Wallet-Owner
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ApiError:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required: [error]

    WalletBalance:
      type: object
      properties:
        balanceSats:
          type: integer
          description: Balance in satoshis
        pendingSendSats:
          type: integer
        pendingReceiveSats:
          type: integer
      required: [balanceSats, pendingSendSats, pendingReceiveSats]

    Transaction:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [send, receive]
        amountSats:
          type: integer
        feeSats:
          type: integer
        description:
          type: string
        timestamp:
          type: string
          format: date-time
        status:
          type: string
          enum: [pending, complete, failed]
        paymentHash:
          type: string
      required: [id, type, amountSats, feeSats, timestamp, status]

    TransactionList:
      type: object
      properties:
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
        total:
          type: integer
      required: [transactions, total]

    SendPaymentRequest:
      type: object
      properties:
        bolt11:
          type: string
          description: BOLT11 Lightning invoice
        amountSats:
          type: integer
          description: Amount in sats (for zero-amount invoices)
      required: [bolt11]

    SendPaymentResponse:
      type: object
      properties:
        success:
          type: boolean
        paymentHash:
          type: string
        feeSats:
          type: integer
        amountSats:
          type: integer
      required: [success, paymentHash, feeSats, amountSats]

    DecodeInvoiceRequest:
      type: object
      properties:
        bolt11:
          type: string
      required: [bolt11]

    DecodedInvoice:
      type: object
      properties:
        amountSats:
          type: integer
        description:
          type: string
        expiry:
          type: integer
        paymentHash:
          type: string
        isExpired:
          type: boolean
      required: [isExpired]

    CreateInvoiceRequest:
      type: object
      properties:
        amountSats:
          type: integer
        description:
          type: string
      required: [amountSats]

    CreateInvoiceResponse:
      type: object
      properties:
        bolt11:
          type: string
        paymentHash:
          type: string
        expiresAt:
          type: string
          format: date-time
      required: [bolt11, paymentHash]

    LightningAddressInfo:
      type: object
      properties:
        address:
          type: string
        lnurlp:
          type: string
      required: [address]

    BtcPrice:
      type: object
      properties:
        currency:
          type: string
        price:
          type: number
        symbol:
          type: string
      required: [currency, price, symbol]

    UserSettings:
      type: object
      properties:
        fiatCurrency:
          type: string
        primaryDisplay:
          type: string
          enum: [sats, fiat]
        soundEffectsEnabled:
          type: boolean
        backupCompleted:
          type: boolean
        lightningAddress:
          type: string
      required: [fiatCurrency, primaryDisplay, soundEffectsEnabled, backupCompleted]

    UpdateSettingsRequest:
      type: object
      properties:
        fiatCurrency:
          type: string
        primaryDisplay:
          type: string
          enum: [sats, fiat]
        soundEffectsEnabled:
          type: boolean
        backupCompleted:
          type: boolean
        lightningAddress:
          type: string

    AgentKey:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        nwcUri:
          type: string
          nullable: true
        apiToken:
          type: string
          nullable: true
        spendingLimitSats:
          type: integer
          nullable: true
        maxDailySats:
          type: integer
          nullable: true
        spentToday:
          type: integer
        connectionType:
          type: string
          enum: [api, nwc]
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        isActive:
          type: boolean
      required: [id, name, spentToday, connectionType, isActive, createdAt]

    AgentKeyList:
      type: object
      properties:
        keys:
          type: array
          items:
            $ref: "#/components/schemas/AgentKey"
      required: [keys]

    CreateAgentKeyRequest:
      type: object
      properties:
        name:
          type: string
        spendingLimitSats:
          type: integer
        maxDailySats:
          type: integer
        connectionType:
          type: string
          enum: [api, nwc]
      required: [name]

    UpdateAgentKeyRequest:
      type: object
      properties:
        name:
          type: string
        spendingLimitSats:
          type: integer
          nullable: true
        maxDailySats:
          type: integer
          nullable: true
        isActive:
          type: boolean

    AgentLog:
      type: object
      properties:
        id:
          type: integer
        action:
          type: string
        amount:
          type: integer
          nullable: true
        status:
          type: string
        detail:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, action, status, createdAt]

    AgentLogList:
      type: object
      properties:
        logs:
          type: array
          items:
            $ref: "#/components/schemas/AgentLog"
      required: [logs]

    BootstrapOwnerDeviceRequest:
      type: object
      properties:
        publicKey:
          type: string
        label:
          type: string
      required: [publicKey, label]

    OwnerDevice:
      type: object
      properties:
        id:
          type: integer
        publicKey:
          type: string
        label:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, publicKey, label, createdAt]

    OwnerAuthChallengeRequest:
      type: object
      properties:
        publicKey:
          type: string
      required: [publicKey]

    OwnerAuthChallengeResponse:
      type: object
      properties:
        challengeId:
          type: integer
        nonce:
          type: string
        expiresAt:
          type: string
          format: date-time
        deviceLabel:
          type: string
        serverTime:
          type: string
          format: date-time
      required: [challengeId, nonce, expiresAt, deviceLabel, serverTime]

    OwnerAuthVerifyRequest:
      type: object
      properties:
        challengeId:
          type: integer
        publicKey:
          type: string
        signature:
          type: string
      required: [challengeId, publicKey, signature]

    OwnerSessionResponse:
      type: object
      properties:
        sessionToken:
          type: string
        expiresAt:
          type: string
          format: date-time
        device:
          type: object
          properties:
            id:
              type: integer
            label:
              type: string
            publicKey:
              type: string
          required: [id, label, publicKey]
      required: [sessionToken, expiresAt, device]

    OwnerSessionStatus:
      type: object
      properties:
        ok:
          type: boolean
        session:
          type: object
          properties:
            sessionId:
              type: integer
            expiresAt:
              type: string
              format: date-time
            deviceId:
              type: integer
            label:
              type: string
            publicKey:
              type: string
          required: [sessionId, expiresAt, deviceId, label, publicKey]
      required: [ok, session]

    DeleteResponse:
      type: object
      properties:
        success:
          type: boolean
      required: [success]

    SeedPhraseResponse:
      type: object
      properties:
        words:
          type: array
          items:
            type: string
      required: [words]
